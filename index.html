<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2A44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Obras">
<meta name="version-app" content="2026-11-23-github">
<title>Control de Obras</title>
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* Estructura: menú lateral fijo en ordenador, barra superior + menú inferior en móvil */
:root{
  --azul:#0F2A44; --azul-2:#17385A; --azul-borde:#3A5674;
  --naranja:#C2410C; --naranja-h:#9A3412; --naranja-suave:#FFF1E8; --naranja-vivo:#F97316;
  --verde:#15803D; --verde-suave:#E6F4EA;
  --rojo:#B91C1C; --rojo-suave:#FDECEC; --rojo-oscuro:#8A1C1C; --rojo-borde:#E8B4B4;
  --fondo:#F1F3F5; --blanco:#FFFFFF; --borde:#DDE2E8; --borde-input:#C5CDD6; --linea:#E4E8ED; --gris-suave:#E4E8ED; --cabecera-tabla:#F7F8FA;
  --texto:#1F2933; --texto-2:#3E4C59; --gris:#52606D; --nav-texto:#C9D6E3; --nav-tenue:#9FB3C8;
  --fuente:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radio:10px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--fuente);font-size:15px;line-height:1.45;background:var(--fondo);color:var(--texto);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--azul)} a:hover{color:var(--naranja)}
:focus-visible{outline:3px solid var(--naranja-vivo);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ---------- Acceso ---------- */
.acceso{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));background:var(--azul)}
.acceso-caja{width:100%;max-width:400px;background:var(--blanco);border-radius:14px;padding:28px 24px;display:flex;flex-direction:column;gap:18px}
.acceso-marca{display:flex;flex-direction:column;gap:4px}
.acceso-marca span{font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--naranja)}
.acceso-marca h1{margin:0;font-size:24px;color:var(--azul)}
.acceso-marca p{margin:0;color:var(--gris)}
.enlace-boton{background:none;border:none;padding:8px 0;color:var(--azul);font-weight:600;cursor:pointer;text-align:left;text-decoration:underline;text-underline-offset:3px}
.aviso{padding:12px 14px;border-radius:8px;font-size:14px}
.aviso-error{background:var(--rojo-suave);color:var(--rojo-oscuro)}
.aviso-ok{background:var(--verde-suave);color:#0F5A2A}
.aviso-info{background:var(--gris-suave);color:var(--texto-2)}

/* ---------- Estructura ---------- */
.app{min-height:100%;display:flex}
.sidebar{display:none}
.principal{flex:1;min-width:0;display:flex;flex-direction:column}
.cab{position:sticky;top:0;z-index:20;background:var(--azul);color:var(--blanco);padding:calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px));display:flex;align-items:center;gap:10px;min-height:72px}
.cab-textos{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.cab-marca{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--nav-texto)}
.cab h1{margin:0;font-size:22px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.cab-sub{display:none;margin:0;color:var(--gris);font-size:15px}
.cab-acciones{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.cab-volver{width:44px;height:44px;flex:none;border-radius:10px;color:var(--blanco);display:flex;align-items:center;justify-content:center;margin-left:-6px}
.cab-volver:hover{color:var(--blanco);background:var(--azul-2)}
.cab .btn-secundario{display:none}
.contenido{flex:1;padding:16px max(16px, env(safe-area-inset-right, 0px)) calc(100px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:16px;width:100%;max-width:1240px}
.menu-inf{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--azul);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px max(4px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(4px, env(safe-area-inset-left, 0px))}
.menu-inf a{height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--nav-texto);text-decoration:none;border-radius:8px}
.menu-inf a[aria-current="page"]{color:var(--blanco);font-weight:600}
.menu-inf a[aria-current="page"] svg{color:var(--naranja-vivo)}

@media (min-width: 900px){
  .sidebar{display:flex;flex-direction:column;gap:26px;width:248px;flex:none;background:var(--azul);color:var(--blanco);padding:24px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .menu-inf{display:none}
  .cab{background:var(--blanco);color:var(--azul);border-bottom:1px solid var(--borde);padding:20px 32px;min-height:0}
  .cab-marca{display:none}
  .cab h1{font-size:26px}
  .cab-sub{display:block}
  .cab-volver{color:var(--azul);border:1px solid var(--borde)}
  .cab-volver:hover{color:var(--azul);background:var(--fondo)}
  .cab .btn-secundario{display:inline-flex}
  .contenido{padding:24px 32px 48px;gap:20px}
  .solo-movil{display:none!important}
}
@media (max-width: 899.98px){ .solo-pc{display:none!important} }

.marca-lateral{padding:0 8px;display:flex;flex-direction:column;gap:4px}
.marca-lateral strong{font-size:18px;letter-spacing:.04em}
.marca-lateral span{font-size:13px;color:var(--nav-texto)}
.nav-lateral{display:flex;flex-direction:column;gap:4px}
.nav-lateral a{height:44px;border-radius:8px;display:flex;align-items:center;gap:12px;padding:0 12px;color:var(--nav-texto);text-decoration:none;font-size:15px}
.nav-lateral a:hover{background:var(--azul-2);color:var(--blanco)}
.nav-lateral a[aria-current="page"]{background:var(--azul-2);color:var(--blanco);font-weight:600}
.nav-lateral a[aria-current="page"] svg{color:var(--naranja-vivo)}
.proximamente-lat{display:flex;flex-direction:column;gap:8px;padding:0 12px;font-size:14px;color:var(--nav-tenue)}
.proximamente-lat b{font-size:12px;letter-spacing:.1em;font-weight:600}
.cuenta-lat{margin-top:auto;border-top:1px solid var(--azul-borde);padding:16px 12px 0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--nav-texto);word-break:break-all}
.cuenta-lat button{align-self:flex-start;background:none;border:1px solid var(--azul-borde);color:var(--blanco);border-radius:8px;height:40px;padding:0 14px;cursor:pointer}
.cuenta-lat button:hover{background:var(--azul-2)}

/* ---------- Botones y formularios ---------- */
.btn{height:46px;padding:0 18px;border-radius:10px;border:none;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn-principal{background:var(--naranja);color:var(--blanco)}
.btn-principal:hover{background:var(--naranja-h);color:var(--blanco)}
.btn-secundario{background:var(--blanco);color:var(--azul);border:1.5px solid var(--azul)}
.btn-secundario:hover{background:var(--fondo);color:var(--azul)}
.btn-peligro{background:var(--blanco);color:var(--rojo);border:1.5px solid var(--rojo)}
.btn-peligro:hover{background:var(--rojo-suave);color:var(--rojo)}
.btn-bloque{width:100%;height:52px;font-size:16px}
.btn[disabled]{opacity:.6;cursor:wait}
.cab .btn-principal{height:44px;padding:0 14px}
.btn-pdf{height:44px;padding:0 14px;border-radius:10px;border:1.5px solid currentColor;background:transparent;color:inherit;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn-pdf:hover{background:rgba(127,127,127,.12)}
.btn-pdf[disabled]{opacity:.6;cursor:wait}
.form{display:flex;flex-direction:column;gap:16px;max-width:640px}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo label,.campo .etq{font-size:14px;font-weight:600}
.campo small{font-size:13px;color:var(--gris)}
.opcional{font-weight:400;color:var(--gris)}
input[type=text],input[type=email],input[type=password],input[type=date],input[type=search],select,textarea{width:100%;min-width:0;height:48px;border:1px solid var(--borde-input);border-radius:10px;padding:0 14px;font-size:16px;background:var(--blanco);color:var(--texto)}
textarea{height:auto;padding:12px 14px;resize:vertical;min-height:96px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(15,42,68,.18)}
.invalido{border-color:var(--rojo)!important}
.dos-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.botonera{display:flex;flex-direction:column;gap:10px;margin-top:6px}
@media (min-width:900px){ .botonera{flex-direction:row} .botonera .btn-bloque{width:auto;min-width:180px} .botonera .btn-peligro{margin-left:auto} }
.error-form{color:var(--rojo);font-size:14px;font-weight:600}

/* ---------- Tarjetas y listas ---------- */
.tarjeta{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tarjeta-cab{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tarjeta h2{margin:0;font-size:17px;color:var(--azul)}
.tarjeta-cab a{font-size:14px;font-weight:600;white-space:nowrap}
.etiqueta-seccion{margin:0;font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--gris);text-transform:uppercase}
.vacio{margin:0;color:var(--gris)}
.vacio-caja{border:1.5px dashed var(--borde);border-radius:8px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.enlace-accion{font-weight:600;color:var(--naranja)}
.resumen{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:900px){ .resumen{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px} }
.dato{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:14px 16px;display:flex;flex-direction:column-reverse;gap:2px;text-decoration:none;color:inherit}
.dato:hover{border-color:var(--azul);color:inherit}
.dato b{font-size:30px;color:var(--azul);line-height:1.1;font-variant-numeric:tabular-nums}
.dato span{font-size:14px;color:var(--gris)}
.rejilla-inicio{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:900px){ .rejilla-inicio{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))} }
.acciones-rapidas{display:flex;flex-direction:column;gap:10px}
.lista-filas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.lista-filas li{border-top:1px solid var(--linea)}
.lista-filas li:first-child{border-top:none}
.fila-enlace{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;text-decoration:none;color:var(--texto);min-height:44px}
.fila-enlace:hover{color:var(--azul)}
.fila-enlace .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis}
.fila-enlace .m{font-size:13px;color:var(--gris)}
.pila{display:flex;flex-direction:column;gap:2px;min-width:0}

.pastilla{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.p-verde{background:var(--verde-suave);color:var(--verde)}
.p-rojo{background:var(--rojo-suave);color:var(--rojo)}
.p-gris{background:var(--gris-suave);color:var(--texto-2)}

.filtros{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filtros .campo{flex:1 1 220px}
.filtros .campo label{font-size:13px;color:var(--gris)}
.filtros input,.filtros select{height:46px;font-size:15px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--borde-input);background:var(--blanco);font-size:14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--azul);color:var(--blanco);border-color:var(--azul);font-weight:600}
.casilla-linea{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;cursor:pointer}
.casilla-linea input,.check-lista input{width:20px;height:20px;accent-color:var(--azul);flex:none}
.contador{font-size:14px;color:var(--gris)}

.ficha{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:var(--texto)}
.ficha:hover{border-color:var(--azul);color:var(--texto)}
.ficha-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ficha h3{margin:0;font-size:17px;color:var(--azul)}
.ficha .sup{font-size:13px;font-weight:600;color:var(--gris)}
.ficha-datos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:14px}
.ficha-datos span{display:block;color:var(--gris)}
.ficha-datos b{font-weight:600}
.ficha-pie{border-top:1px solid var(--linea);padding-top:10px;display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--gris)}
.ficha-pie b{color:var(--azul)}
.ficha-icono{display:flex;align-items:center;gap:14px}
.ficha-icono .ic{width:44px;height:44px;flex:none;border-radius:22px;background:var(--gris-suave);color:var(--azul);display:flex;align-items:center;justify-content:center}
.ficha-icono .ic.cuadrado{border-radius:10px}
.incidencia-caja{background:var(--rojo-suave);border-radius:8px;padding:10px 12px;font-size:14px;color:var(--rojo-oscuro)}
.lista-fichas{display:flex;flex-direction:column;gap:12px}

.tabla-caja{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{background:var(--cabecera-tabla);text-align:left;padding:13px 16px;font-size:13px;font-weight:600;color:var(--gris);border-bottom:1px solid var(--borde);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--linea);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#F9FAFB}
td a{font-weight:600;text-decoration:none}
.der{text-align:right} .centro{text-align:center}
.recorte{max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--texto-2)}

/* ---------- Parte diario ---------- */
.bloque{background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio);padding:14px 16px;display:flex;flex-direction:column;gap:6px;margin:0;min-width:0}
.bloque legend{padding:0;font-size:16px;font-weight:700;color:var(--azul);float:left;width:100%;margin-bottom:6px}
.bloque legend + *{clear:both}
.bloque-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.check-lista{display:flex;flex-direction:column}
.check-lista label{display:flex;align-items:center;gap:12px;min-height:46px;border-top:1px solid var(--linea);cursor:pointer}
.check-lista label:first-child{border-top:none}
.btn-dictar{align-self:flex-start;margin-top:6px;height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--azul);background:var(--blanco);color:var(--azul);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;cursor:pointer}
.btn-dictar:hover{background:var(--fondo)}
.btn-dictar.activo{background:var(--rojo);border-color:var(--rojo);color:var(--blanco);animation:latido 1.4s ease-in-out infinite}
.btn-dictar.activo:hover{background:var(--rojo)}
@keyframes latido{0%,100%{box-shadow:0 0 0 0 rgba(185,28,28,.45)}50%{box-shadow:0 0 0 8px rgba(185,28,28,0)}}
textarea.dictando{border-color:var(--rojo);box-shadow:0 0 0 3px rgba(185,28,28,.15)}
.filtros-lista{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:2px}
.filtros-lista .campo label{font-size:13px;color:var(--gris);font-weight:600}
.filtros-lista select,.filtros-lista input{height:44px;font-size:15px;padding:0 10px}
.solo-marcados{min-height:40px;font-size:14px;color:var(--texto-2)}
.solo-marcados input{accent-color:var(--azul)}
.check-lista .det{font-size:13px;color:var(--gris)}
.dos-botones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.conmuta{height:46px;border-radius:10px;border:1px solid var(--borde-input);background:var(--blanco);font-weight:600;cursor:pointer}
.conmuta.si-on[aria-pressed="true"]{background:var(--rojo);border-color:var(--rojo);color:var(--blanco)}
.conmuta.no-on[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:var(--blanco)}
.incidencia-detalle{background:var(--rojo-suave);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:12px}
.incidencia-detalle label{color:var(--rojo-oscuro)}
.tipos{display:flex;flex-wrap:wrap;gap:8px;border:none;padding:0;margin:0}
.tipos input{position:absolute;opacity:0;width:1px;height:1px}
.tipos label{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--rojo-borde);background:var(--blanco);color:var(--rojo-oscuro);display:inline-flex;align-items:center;cursor:pointer;font-size:14px;font-weight:500}
.tipos input:checked + label{background:var(--rojo);border-color:var(--rojo);color:var(--blanco);font-weight:600}
.tipos input:focus-visible + label{outline:3px solid var(--naranja-vivo);outline-offset:2px}

/* ---------- Tareas ---------- */
.segmento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:var(--gris-suave);border-radius:10px;padding:4px}
.segmento button{height:40px;border:none;border-radius:8px;background:transparent;color:var(--texto-2);cursor:pointer}
.segmento button[aria-pressed="true"]{background:var(--blanco);color:var(--azul);font-weight:700;box-shadow:0 1px 2px rgba(15,42,68,.15)}
.tareas-layout{display:flex;flex-direction:column;gap:16px}
.tareas-layout.ver-lista .panel-cal,.tareas-layout.ver-cal .panel-lista{display:none}
@media (min-width:900px){
  .tareas-layout{display:grid;grid-template-columns:minmax(0,2fr) minmax(300px,1fr);align-items:start}
  .tareas-layout.ver-lista .panel-cal,.tareas-layout.ver-cal .panel-lista{display:flex}
}
.panel-cal,.panel-lista{display:flex;flex-direction:column;gap:16px;min-width:0}
.tarea{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--linea)}
.tarea:first-of-type{border-top:none}
.tarea input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--verde);flex:none;cursor:pointer}
.tarea a{font-weight:600;text-decoration:none;color:var(--texto)}
.tarea a:hover{color:var(--azul);text-decoration:underline}
.tarea .m{font-size:13px;color:var(--gris)}
.tarea.atrasada .m{color:var(--rojo)}
.tarea.hecha a{text-decoration:line-through;color:var(--gris);font-weight:500}
.grupo-tareas h3{margin:6px 0 2px;font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--gris)}
.grupo-tareas h3.rojo{color:var(--rojo)}
.cal-cab{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal-cab h2{font-size:18px}
.cal-nav{display:flex;gap:6px}
.icono-btn{width:44px;height:44px;border-radius:10px;border:1px solid var(--borde);background:var(--blanco);color:var(--azul);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.cal-nav .hoy{width:auto;padding:0 14px;font-weight:600;font-size:14px}
.cal-semana,.cal-rejilla{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal-semana span{text-align:center;font-size:12px;font-weight:600;color:var(--gris);padding:4px 0}
.cal-dia{height:48px;border:none;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0;cursor:pointer;font-size:15px;color:var(--texto);min-width:0}
.cal-dia:hover{background:var(--fondo)}
.cal-dia.otro{visibility:hidden}
.cal-dia.es-hoy{background:var(--naranja-suave);color:var(--naranja);font-weight:700}
.cal-dia.sel{background:var(--azul);color:var(--blanco);font-weight:700}
.cal-dia .punto{width:6px;height:6px;border-radius:3px;background:transparent}
.cal-dia .punto.on{background:var(--naranja)}
.cal-dia .punto.tarde{background:var(--rojo)}
.cal-dia.sel .punto.on{background:var(--naranja-vivo)}
.cal-dia .mini{display:none}
@media (min-width:900px){
  .cal-semana span{text-align:left;padding:4px 6px}
  .cal-dia{height:auto;min-height:86px;border:1px solid var(--linea);background:var(--blanco);align-items:stretch;justify-content:flex-start;padding:6px;gap:4px;font-size:14px;text-align:left}
  .cal-dia .n{height:26px;min-width:26px;align-self:flex-start;display:flex;align-items:center;justify-content:center;padding:0 4px;border-radius:13px;font-weight:600}
  .cal-dia.es-hoy{background:var(--blanco);color:var(--texto)}
  .cal-dia.es-hoy .n{background:var(--naranja);color:var(--blanco)}
  .cal-dia.sel{background:var(--blanco);color:var(--texto);border:2px solid var(--azul)}
  .cal-dia .punto{display:none}
  .cal-dia .mini{display:block;font-size:12px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--naranja-suave);color:var(--naranja-h);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cal-dia .mini.tarde{background:var(--rojo-suave);color:var(--rojo)}
  .cal-dia .mini.mas{background:transparent;color:var(--gris);padding:0 6px}
}

/* ---------- Más ---------- */
.menu-mas{list-style:none;margin:0;padding:0;background:var(--blanco);border:1px solid var(--borde);border-radius:var(--radio)}
.menu-mas li+li{border-top:1px solid var(--linea)}
.menu-mas a{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:56px;text-decoration:none;color:var(--texto);font-weight:600}
.menu-mas a svg:last-child{margin-left:auto;color:var(--gris)}
.chips-prox{display:flex;flex-wrap:wrap;gap:8px}
.chips-prox span{padding:8px 12px;border-radius:999px;background:var(--gris-suave);color:var(--texto-2);font-size:14px}

/* ---------- Aviso flotante y confirmación ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom, 0px));z-index:60;background:var(--azul);color:var(--blanco);padding:12px 18px;border-radius:10px;font-weight:600;box-shadow:0 6px 20px rgba(15,42,68,.3);max-width:calc(100% - 32px)}
.toast.error{background:var(--rojo)}
@media (min-width:900px){ .toast{bottom:28px} }
.velo{position:fixed;inset:0;z-index:70;background:rgba(15,42,68,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dialogo{background:var(--blanco);border-radius:14px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:16px}
.dialogo p{margin:0;font-size:16px}
.dialogo .botones{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.cargando{color:var(--gris);padding:24px 0}
</style>
</head>

function mensajeError(e) {
  const m = (e && (e.message || e.error_description || String(e))) || 'Error desconocido';
  if (/Invalid login credentials/i.test(m)) return 'Correo o contraseña incorrectos.';
  if (/Email not confirmed/i.test(m)) return 'Falta confirmar el correo. Abre el enlace que te ha llegado y vuelve a entrar.';
  if (/already registered/i.test(m)) return 'Ya existe una cuenta con ese correo. Usa "Entrar".';
  if (/Password should be/i.test(m)) return 'La contraseña debe tener al menos 6 caracteres.';
  if (/rate limit/i.test(m)) return 'Demasiados intentos seguidos. Espera un minuto y vuelve a probar.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return 'No hay conexión con el servidor. Revisa la conexión a internet.';
  if (/does not exist|Could not find the table|schema cache/i.test(m)) return 'Faltan las tablas en Supabase. Ejecuta el archivo supabase.sql en el SQL Editor.';
  if (/Invalid API key|JWT/i.test(m)) return 'La clave de Supabase no es válida. Revisa la conexión.';
  return m;
}

function confirmar(texto, boton = 'Borrar') {
  return new Promise(res => {

    m.innerHTML = `<div class="velo"><div class="dialogo" role="alertdialog" aria-modal="true" aria-labelledby="dlg-t">
      <p id="dlg-t">${esc(texto)}</p>

      <button type="button" class="btn btn-peligro" data-r="1">${esc(boton)}</button></div></div></div>`;
    const cerrar = r => { m.innerHTML = ''; document.removeEventListener('keydown', tecla); res(r); };
    const tecla = e => { if (e.key === 'Escape') cerrar(false); };

  $('#app').hidden = true; appIniciada = false;
  const a = $('#acceso'); a.hidden = false;
  const titulos = { entrar: 'Entrar', crear: 'Crear cuenta', olvido: 'Recuperar contraseña', nueva: 'Nueva contraseña' };

    ${modo !== 'olvido' ? `<div class="campo"><label for="a-pass">Contraseña</label><input id="a-pass" type="password" autocomplete="${modo === 'entrar' ? 'current-password' : 'new-password'}" required minlength="6">${modo !== 'entrar' ? '<small>Mínimo 6 caracteres.</small>' : ''}</div>` : ''}
    <button class="btn btn-principal btn-bloque" type="submit" id="a-btn">${modo === 'entrar' ? 'Entrar' : modo === 'crear' ? 'Crear cuenta' : modo === 'olvido' ? 'Enviar enlace' : 'Guardar contraseña'}</button>
    <div style="display:flex;flex-direction:column">
      ${modo === 'entrar' ? `<button type="button" class="enlace-boton" data-modo="crear">Es mi primera vez: crear cuenta</button><button type="button" class="enlace-boton" data-modo="olvido">He olvidado la contraseña</button>` : ''}
      ${modo === 'crear' || modo === 'olvido' ? `<button type="button" class="enlace-boton" data-modo="entrar">Ya tengo cuenta: entrar</button>` : ''}
      ${!leerConfig()?.fija && modo === 'entrar' ? `<button type="button" class="enlace-boton" data-cambiar-con>Cambiar conexión con Supabase</button>` : ''}
    </div>
  </form>`;
  $$('[data-modo]', a).forEach(b => b.onclick = () => pantallaLogin(b.dataset.modo));
  const cc = $('[data-cambiar-con]', a); if (cc) cc.onclick = () => pantallaConexion();
  $('#f-acc').onsubmit = async e => {
    e.preventDefault();
    const email = val('a-email'), pass = $('#a-pass')?.value || '';
    if (modo !== 'nueva' && !/^\S+@\S+\.\S+$/.test(email)) return pantallaLogin(modo, { t: 'Escribe un correo válido.' });
    if (modo !== 'olvido' && pass.length < 6) return pantallaLogin(modo, { t: 'La contraseña debe tener al menos 6 caracteres.' });
    const btn = $('#a-btn'); btn.disabled = true;
    try {
      if (modo === 'entrar') {
        const { error } = await sb.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
      } else if (modo === 'crear') {
        const { data, error } = await sb.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.origin + location.pathname } });
        if (error) throw error;
        if (!data.session) pantallaLogin('entrar', { ok: true, t: 'Cuenta creada. Te hemos enviado un correo: abre el enlace para confirmarla y después entra aquí.' });
      } else if (modo === 'olvido') {
        const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
        if (error) throw error;
        pantallaLogin('entrar', { ok: true, t: 'Si el correo existe, te llegará un enlace para cambiar la contraseña.' });
      } else if (modo === 'nueva') {
        const { error } = await sb.auth.updateUser({ password: pass });
        if (error) throw error;
        aviso('Contraseña cambiada');
        arrancarApp();
      }
    } catch (err) {
      pantallaLogin(modo, { t: mensajeError(err) });
    }
  };
  const primero = $('input', a); if (primero) primero.focus();
}

async function iniciar() {
  const cfg = leerConfig();
  if (!cfg) return pantallaConexion();
  if (!window.supabase) return pantallaConexion('No se ha podido cargar la librería de Supabase. Revisa la conexión a internet y recarga.');
  let recuperando = /type=recovery/.test(location.hash);
  try { sb = window.supabase.createClient(cfg.url, cfg.anonKey); }
  catch (e) { return pantallaConexion('La URL o la clave no son válidas.'); }
  sb.auth.onAuthStateChange((evento, sesion) => {
    if (evento === 'PASSWORD_RECOVERY') { recuperando = true; usuario = sesion?.user || null; pantallaLogin('nueva'); return; }
    if (evento === 'SIGNED_OUT') { usuario = null; pantallaLogin(); return; }
    if (sesion && !recuperando && !appIniciada) { usuario = sesion.user; setTimeout(arrancarApp, 0); }
  });
  const { data: { session } } = await sb.auth.getSession();
  if (recuperando) return;
  if (!session) return pantallaLogin();
  usuario = session.user;
  arrancarApp();
}

async function salir() { await sb.auth.signOut(); }

/* ---------- Dictado por voz (reconocimiento de voz del navegador) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const esAndroid = /Android/i.test(navigator.userAgent);
let dictado = null;
function limpiarDictado(t, inicioFrase) {
  return t.replace(/\s*\bpunto y aparte\b\s*/gi, '.\n').replace(/\s*\bpunto y seguido\b\s*/gi, '. ')
    .replace(/\s*\bnueva l[ií]nea\b\s*/gi, '\n').replace(/[ \t]+/g, ' ')
    .replace(inicioFrase ? /(^|[.\n]\s*)([a-záéíóúñü])/g : /([.\n]\s*)([a-záéíóúñü])/g, (m, a, b) => a + b.toUpperCase());
}
function pararDictado() { if (dictado) { dictado.activo = false; try { dictado.rec.stop(); } catch (e) {} } }
function empezarDictado(ta, b) {
  const st = { ta, b, activo: true, rec: null };
  const arrancar = () => {
    const base = ta.value;
    const sep = base && !/\s$/.test(base) ? ' ' : '';
    const rec = new SR();
    rec.lang = 'es-ES'; rec.interimResults = true; rec.continuous = !esAndroid;
    let fin = '';
    rec.onresult = e => {
      let prov = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) fin += r[0].transcript.trim() + ' '; else prov += r[0].transcript;
      }
      const nuevo = limpiarDictado((fin + prov).trimStart(), !base.trim() || /[.!?\n]\s*$/.test(base));
      ta.value = base + (nuevo ? sep : '') + nuevo;
      ta.scrollTop = ta.scrollHeight;
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') { st.activo = false; aviso('No hay permiso para usar el micrófono. Actívalo en los ajustes del navegador para esta página.', true); }
      else if (e.error === 'no-speech') { if (!esAndroid) aviso('No te he oído. Pulsa Dictar y vuelve a probar.', true); }
      else if (e.error === 'network') { st.activo = false; aviso('El dictado necesita conexión a internet.', true); }
      else if (e.error !== 'aborted') { st.activo = false; aviso('El dictado se ha detenido (' + e.error + ').', true); }
    };
    rec.onend = () => {
      ta.value = ta.value.replace(/[ \t]+$/, '');
      if (st.activo && esAndroid && dictado === st) { setTimeout(() => { if (st.activo) arrancar(); }, 250); return; }
      b.classList.remove('activo'); ta.classList.remove('dictando'); b.setAttribute('aria-pressed', 'false'); $('span', b).textContent = 'Dictar';
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      if (dictado === st) dictado = null;
    };
    st.rec = rec;
    try { rec.start(); } catch (e) { st.activo = false; aviso('No se ha podido empezar a dictar. Prueba otra vez.', true); }
  };
  dictado = st;
  b.classList.add('activo'); ta.classList.add('dictando'); b.setAttribute('aria-pressed', 'true'); $('span', b).textContent = 'Parar';
  arrancar();
}
function prepararDictado(raiz) {
  if (!SR) return;
  $$('textarea[data-dictado]', raiz).forEach(ta => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'btn-dictar'; b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', 'Dictar por voz en este cuadro');
    b.innerHTML = ic('micro', 18) + '<span>Dictar</span>';

const PDF_LIBS = [
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'
];
function cargarScript(src) {
  return new Promise((ok, ko) => {
    const ya = document.querySelector(`script[src="${src}"]`);
    if (ya && ya.dataset.cargado) return ok();
    const s = ya || document.createElement('script');
    s.src = src; s.async = false;
    s.onload = () => { s.dataset.cargado = '1'; ok(); };
    s.onerror = () => ko(new Error('No se ha podido cargar el generador de PDF. Revisa la conexión a internet.'));
    if (!ya) document.head.appendChild(s);
  });
}
async function cargarPDF() {
  if (!(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable)) for (const s of PDF_LIBS) await cargarScript(s);
  return window.jspdf.jsPDF;
}
const C_AZUL = [15, 42, 68], C_NARANJA = [194, 65, 12], C_ROJO = [185, 28, 28], C_VERDE = [21, 128, 61], C_GRIS = [82, 96, 109], C_LINEA = [221, 226, 232], C_FONDO = [241, 243, 245];
const fechaLargaAnio = s => `${fLarga(s)} de ${s.slice(0, 4)}`;
const nombreArchivo = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9_-]+/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, '');

// Documento A4 con cabecera y pie en todas las páginas
async function nuevoInforme(titulo) {
  const JsPDF = await cargarPDF();
  const doc = new JsPDF({ unit: 'mm', format: 'a4' });
  const M = 15, W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  let logoProp = null;
  if (EMPRESA.logo) {
    try { const p = doc.getImageProperties(EMPRESA.logo); logoProp = p.width / p.height; } catch (e) { logoProp = null; }
  }
  const cabeceraPagina = () => {
    let x = M;
    if (logoProp) {
      const h = 11, w = Math.min(62, h * logoProp);
      doc.addImage(EMPRESA.logo, M, 10, w, w / logoProp);
      x = M + w + 5;
    }
    doc.setTextColor(...C_AZUL);
    if (EMPRESA.nombre) { doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.text(EMPRESA.nombre, x, 15.5); }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(13);
    doc.text(titulo.toUpperCase(), W - M, 15.5, { align: 'right' });
    doc.setDrawColor(...C_AZUL); doc.setLineWidth(0.5); doc.line(M, 27, W - M, 27);
  };
  const ahora = new Date();
  const generado = `${pad(ahora.getDate())}/${pad(ahora.getMonth() + 1)}/${ahora.getFullYear()} ${pad(ahora.getHours())}:${pad(ahora.getMinutes())}`;
  const terminar = () => {
    const n = doc.getNumberOfPages();
    for (let i = 1; i <= n; i++) {
      doc.setPage(i); cabeceraPagina();
      doc.setDrawColor(...C_LINEA); doc.setLineWidth(0.3); doc.line(M, H - 14, W - M, H - 14);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...C_GRIS);
      doc.text(`Control de Obras · Generado el ${generado}`, M, H - 9);
      doc.text(`Página ${i} de ${n}`, W - M, H - 9, { align: 'right' });
    }
  };
  // Tabla con estilo común
  const tabla = (opts) => doc.autoTable(Object.assign({
    margin: { top: 34, left: M, right: M, bottom: 20 },
    theme: 'grid',
    styles: { font: 'helvetica', fontSize: 9.5, cellPadding: 2.4, textColor: [31, 41, 51], lineColor: C_LINEA, lineWidth: 0.2, overflow: 'linebreak', valign: 'top' },
    headStyles: { fillColor: C_FONDO, textColor: C_GRIS, fontStyle: 'bold', fontSize: 8.5 },
    rowPageBreak: 'auto'
  }, opts, { startY: opts.startY || siguiente() }));
  const siguiente = (extra = 7) => (doc.lastAutoTable ? doc.lastAutoTable.finalY + extra : 34);
  const seccion = (texto, color = C_AZUL) => {
    let y = siguiente(9);
    if (y > H - 40) { doc.addPage(); y = 34; }
    doc.setFont('helvetica', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...color);
    doc.text(texto.toUpperCase(), M, y);
    return y + 3;
  };
  const datosClave = (filas) => tabla({
    startY: 34, theme: 'plain', body: filas,
    styles: { fontSize: 10, cellPadding: { top: 1.6, bottom: 1.6, left: 0, right: 2 } },
    columnStyles: { 0: { cellWidth: 34, fontStyle: 'bold', textColor: C_GRIS }, 1: { textColor: [31, 41, 51] } }
  });
  const bloqueTexto = (txt, opts = {}) => tabla({ startY: seccion(opts.titulo, opts.colorTitulo), body: [[txt]], theme: 'plain',
    styles: Object.assign({ fontSize: 10, cellPadding: 3, fillColor: opts.fondo || C_FONDO, textColor: opts.color || [31, 41, 51], lineHeight: 1.3 }, opts.estilos || {}) });
  return { doc, M, W, H, tabla, seccion, datosClave, bloqueTexto, siguiente, terminar };
}

async function pdfParte(id) {
  const p = await q(sb.from('partes').select('*,obras(numero,nombre),parte_personal(personal(nombre,apellidos,dni,categoria,empresa)),parte_maquinaria(maquinaria(nombre,tipo,empresa))').eq('id', id).single());
  const r = await nuevoInforme('Parte diario de obra');
  const { doc, M, W, H } = r;
  r.datosClave([
    ['Obra', `${p.obras?.numero || ''} · ${p.obras?.nombre || ''}`],
    ['Fecha', fechaLargaAnio(p.fecha)]
  ]);
  r.bloqueTexto(p.trabajos || 'Sin trabajos anotados.', { titulo: 'Trabajos realizados' });
  const pers = (p.parte_personal || []).map(x => x.personal).filter(Boolean)
    .sort((a, b) => (a.empresa || '').localeCompare(b.empresa || '', 'es') || nombreCompleto(a).localeCompare(nombreCompleto(b), 'es'));
  if (pers.length) r.tabla({ startY: r.seccion(`Personal (${pers.length})`), head: [['Nombre y apellidos', 'DNI / NIE', 'Categoría', 'Empresa']],
    body: pers.map(x => [nombreCompleto(x), x.dni || '—', x.categoria || '—', x.empresa || '—']), columnStyles: { 1: { cellWidth: 26 } } });
  else r.bloqueTexto('No se ha registrado personal en este parte.', { titulo: 'Personal' });
  const maq = (p.parte_maquinaria || []).map(x => x.maquinaria).filter(Boolean);
  if (maq.length) r.tabla({ startY: r.seccion(`Maquinaria (${maq.length})`), head: [['Máquina', 'Tipo', 'Empresa']],
    body: maq.map(x => [x.nombre, x.tipo || '—', x.empresa || '—']) });
  else r.bloqueTexto('No se ha registrado maquinaria en este parte.', { titulo: 'Maquinaria' });
  if (p.hay_incidencia) r.bloqueTexto(`${p.incidencia_tipo || 'Incidencia'}: ${p.incidencia_descripcion || ''}`.trim(),
    { titulo: 'Incidencias', colorTitulo: C_ROJO, fondo: [253, 236, 236], color: [138, 28, 28] });
  else r.bloqueTexto('Sin incidencias.', { titulo: 'Incidencias', fondo: [230, 244, 234], color: C_VERDE });
  // Espacio para firma
  let y = r.siguiente(12);
  if (y + 30 > H - 20) { doc.addPage(); y = 34; }
  const wF = 75;
  doc.setDrawColor(...C_LINEA); doc.setLineWidth(0.3); doc.rect(W - M - wF, y, wF, 28);
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...C_GRIS);
  doc.text('Firma del responsable', W - M - wF + 3, y + 5);
  r.terminar();
  doc.save(`${nombreArchivo(`Parte_${p.obras?.numero || 'obra'}_${p.fecha}`)}.pdf`);
}

async function pdfAnotaciones(obraId, desde, hasta) {
  const obra = await q(sb.from('obras').select('numero,nombre').eq('id', obraId).single());
  let consulta = sb.from('visitas').select('fecha,notas').eq('obra_id', obraId).order('fecha').order('created_at');
  if (desde) consulta = consulta.gte('fecha', desde);
  if (hasta) consulta = consulta.lte('fecha', hasta);
  const notas = await q(consulta);
  if (!notas.length) { aviso('No hay anotaciones de esa obra en esas fechas.', true); return; }
  const r = await nuevoInforme('Anotaciones de obra');
  const periodo = desde && hasta ? `Del ${fFecha(desde)} al ${fFecha(hasta)}` : desde ? `Desde el ${fFecha(desde)}` : hasta ? `Hasta el ${fFecha(hasta)}` : `Del ${fFecha(notas[0].fecha)} al ${fFecha(notas[notas.length - 1].fecha)}`;
  r.datosClave([
    ['Obra', `${obra.numero} · ${obra.nombre}`],
    ['Periodo', periodo],
    ['Anotaciones', String(notas.length)]
  ]);
  r.tabla({ startY: r.siguiente(6), head: [['Fecha', 'Anotación']],

    columnStyles: { 0: { cellWidth: 24, fontStyle: 'bold', textColor: C_AZUL } } });
  r.terminar();
  r.doc.save(`${nombreArchivo(`Anotaciones_${obra.numero}${desde ? '_' + desde : ''}${hasta ? '_' + hasta : ''}`)}.pdf`);
}

    const datos = { numero: val('o-num'), nombre: val('o-nom'), fecha_inicio: val('o-ini') || null, fecha_fin: val('o-fin') || null, estado: val('o-est'), presupuesto: parseImporte(val('o-pre')) };
    if (!datos.numero) return marcarError('o-num', 'Falta el número de obra.');
    if (!datos.nombre) return marcarError('o-nom', 'Falta el nombre de la obra.');
    if (datos.fecha_inicio && datos.fecha_fin && datos.fecha_fin < datos.fecha_inicio) return marcarError('o-fin', 'El fin previsto no puede ser anterior al inicio.');
    if (Number.isNaN(datos.presupuesto)) return marcarError('o-pre', 'El presupuesto no es un número válido. Ejemplo: 125.000,50');
    guardando($('#o-guardar'), async () => {
      if (nueva) await q(sb.from('obras').insert(datos)); else await q(sb.from('obras').update(datos).eq('id', id));
      aviso('Obra guardada'); irA('#obras');
    });
  };
  const b = $('#o-borrar');
  if (b) b.onclick = async () => {
    if (!await confirmar(`¿Borrar la obra "${o.nombre}"? También se borrarán todos sus partes diarios. No se puede deshacer.`)) return;
    try { await q(sb.from('obras').delete().eq('id', id)); aviso('Obra borrada'); irA('#obras'); } catch (e) { aviso(mensajeError(e), true); }
  };
  if (nueva) $('#o-num').focus();
}

      if (pers.length) await q(sb.from('parte_personal').insert(pers.map(x => ({ parte_id: pid, personal_id: x }))));
      if (maq.length) await q(sb.from('parte_maquinaria').insert(maq.map(x => ({ parte_id: pid, maquina_id: x }))));

  };

/* =================== TAREAS =================== */
const vT = { vista: 'lista', anio: null, mes: null, dia: null, hechas: false };
async function vistaTareas(_, t) {
  const tareas = await q(sb.from('tareas').select('id,texto,fecha,hecha,obra_id,obras(nombre)').order('fecha').order('created_at'));
  if (!vigente(t)) return;
  const hoy = hoyISO();
  if (vT.anio == null) { const d = new Date(); vT.anio = d.getFullYear(); vT.mes = d.getMonth(); vT.dia = hoy; }
  cabecera({ titulo: 'Tareas pendientes', sub: 'Llamadas, entregas y gestiones, organizadas por día', acciones: botonCab('#tarea/nueva', 'Nueva tarea', 'Nueva') });
  const pend = tareas.filter(x => !x.hecha);
  const porDia = {};
  tareas.forEach(x => { (porDia[x.fecha] = porDia[x.fecha] || []).push(x); });

  const pintarTodo = () => {
    const atr = pend.filter(x => x.fecha < hoy), deHoy = pend.filter(x => x.fecha === hoy), prox = pend.filter(x => x.fecha > hoy);
    const hechas = tareas.filter(x => x.hecha).sort((a, b) => b.fecha.localeCompare(a.fecha)).slice(0, 30);
    const grupo = (titulo, l, rojo) => l.length ? `<div class="grupo-tareas"><h3 class="${rojo ? 'rojo' : ''}">${titulo}</h3>${l.map(x => itemTarea(x, hoy)).join('')}</div>` : '';
    // Calendario
    const primero = new Date(vT.anio, vT.mes, 1);
    const desfase = (primero.getDay() + 6) % 7, total = new Date(vT.anio, vT.mes + 1, 0).getDate();
    let celdas = '';
    for (let i = 0; i < desfase; i++) celdas += '<span class="cal-dia otro" aria-hidden="true"></span>';
    for (let n = 1; n <= total; n++) {
      const iso = `${vT.anio}-${pad(vT.mes + 1)}-${pad(n)}`;
      const lista = (porDia[iso] || []).filter(x => !x.hecha);
      const tarde = lista.length && iso < hoy;
      const cls = ['cal-dia', iso === hoy ? 'es-hoy' : '', iso === vT.dia ? 'sel' : ''].join(' ');
      const minis = lista.slice(0, 2).map(x => `<span class="mini${tarde ? ' tarde' : ''}">${esc(x.texto)}</span>`).join('') + (lista.length > 2 ? `<span class="mini mas">+${lista.length - 2} más</span>` : '');
      celdas += `<button type="button" class="${cls}" data-dia="${iso}" aria-pressed="${iso === vT.dia}" aria-label="${esc(fLarga(iso))}${lista.length ? `, ${lista.length} tarea${lista.length > 1 ? 's' : ''} pendiente${lista.length > 1 ? 's' : ''}` : ''}"><span class="n">${n}</span><span class="punto${lista.length ? (tarde ? ' on tarde' : ' on') : ''}"></span>${minis}</button>`;
    }
    const delDia = porDia[vT.dia] || [];
    const nombreMes = mayus(primero.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }));
    $('#vista').innerHTML = `
      <div class="segmento solo-movil" role="group" aria-label="Vista">
        <button type="button" data-vista="lista" aria-pressed="${vT.vista === 'lista'}">Lista</button>
        <button type="button" data-vista="cal" aria-pressed="${vT.vista === 'cal'}">Calendario</button>
      </div>
      <div class="tareas-layout ver-${vT.vista}">
        <div class="panel-cal">
          <section class="tarjeta">
            <div class="cal-cab"><h2>${esc(nombreMes)}</h2>
              <div class="cal-nav"><button type="button" class="icono-btn" data-mes="-1" aria-label="Mes anterior">${ic('atras', 18)}</button><button type="button" class="icono-btn hoy" data-mes="0">Hoy</button><button type="button" class="icono-btn" data-mes="1" aria-label="Mes siguiente">${ic('sig', 18)}</button></div>
            </div>
            <div class="cal-semana" aria-hidden="true">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((d, i) => `<span><span class="solo-movil">${d}</span><span class="solo-pc">${['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'][i]}</span></span>`).join('')}</div>
            <div class="cal-rejilla">${celdas}</div>
          </section>
          <section class="tarjeta" id="t-dia">
            <h2>${esc(fLarga(vT.dia))}</h2>
            ${delDia.length ? `<div>${delDia.map(x => itemTarea(x, hoy, false)).join('')}</div>` : '<p class="vacio">Sin tareas este día.</p>'}
            <a class="enlace-accion" href="#tarea/nueva/${vT.dia}">+ Añadir tarea este día</a>
          </section>
        </div>
        <div class="panel-lista">
          <section class="tarjeta" id="t-lista">
            <h2 class="solo-pc">Todas las pendientes</h2>
            ${pend.length ? grupo('ATRASADAS', atr, true) + grupo('HOY', deHoy) + grupo('PRÓXIMOS DÍAS', prox)
              : '<div class="vacio-caja"><p class="vacio">No tienes tareas pendientes.</p><a class="enlace-accion" href="#tarea/nueva">+ Añadir tarea</a></div>'}
          </section>
          <section class="tarjeta" id="t-hechas">
            <label class="casilla-linea"><input type="checkbox" id="ver-hechas" ${vT.hechas ? 'checked' : ''}> Ver tareas hechas</label>
            ${vT.hechas ? (hechas.length ? `<div>${hechas.map(x => itemTarea(x, hoy)).join('')}</div>` : '<p class="vacio">Todavía no has marcado ninguna como hecha.</p>') : ''}
          </section>
        </div>
      </div>`;
    $$('[data-vista]').forEach(b => b.onclick = () => { vT.vista = b.dataset.vista; pintarTodo(); });
    $$('[data-mes]').forEach(b => b.onclick = () => {
      const d = Number(b.dataset.mes);
      if (d === 0) { const h = new Date(); vT.anio = h.getFullYear(); vT.mes = h.getMonth(); vT.dia = hoy; }
      else { const n = new Date(vT.anio, vT.mes + d, 1); vT.anio = n.getFullYear(); vT.mes = n.getMonth(); vT.dia = isoDe(n); }
      pintarTodo();
    });
    $$('[data-dia]').forEach(b => b.onclick = () => { vT.dia = b.dataset.dia; pintarTodo(); $(`[data-dia="${vT.dia}"]`)?.focus(); });
    $('#ver-hechas').onchange = e => { vT.hechas = e.target.checked; pintarTodo(); };
    enlazarCasillasTareas($('#vista'), pintar);
  };
  pintarTodo();
}

  const pintarLista = () => {
    const txt = fVis.texto.toLowerCase();
    const l = visitas.filter(v => (!fVis.obra || v.obra_id === fVis.obra) && (!fVis.desde || v.fecha >= fVis.desde) && (!fVis.hasta || v.fecha <= fVis.hasta) && (!txt || (v.notas || '').toLowerCase().includes(txt)));
    const c = $('#lista-vis');

    c.innerHTML = `
      <div class="lista-fichas solo-movil">${l.map(v => `<a class="ficha" href="#visita/${v.id}">
        <div class="pila"><span class="sup num">${fFecha(v.fecha)}</span><h3>${esc(etiquetaObra(v))}</h3></div>
        <p style="margin:0;color:var(--texto-2);white-space:pre-line">${esc(v.notas.length > 220 ? v.notas.slice(0, 220) + '…' : v.notas)}</p></a>`).join('')}</div>
      <div class="tabla-caja solo-pc"><table><thead><tr><th>Fecha</th><th>Obra</th><th>Anotaciones</th></tr></thead><tbody>
        ${l.map(v => `<tr data-ir="#visita/${v.id}"><td class="num" style="white-space:nowrap">${fFecha(v.fecha)}</td><td style="white-space:nowrap"><a href="#visita/${v.id}">${esc(etiquetaObra(v))}</a></td><td><div class="recorte" style="max-width:560px">${esc(v.notas)}</div></td></tr>`).join('')}
      </tbody></table></div>
      <p class="contador">${l.length} anotaci${l.length !== 1 ? 'ones' : 'ón'}</p>`;
    $$('[data-ir]', c).forEach(r => r.onclick = e => { if (!e.target.closest('a')) location.hash = r.dataset.ir; });
  };
  $('#v-f-obra').onchange = e => { fVis.obra = e.target.value; pintarLista(); };
  $('#v-f-txt').oninput = e => { fVis.texto = e.target.value; pintarLista(); };
  $('#v-f-desde').onchange = e => { fVis.desde = e.target.value; pintarLista(); };
  $('#v-f-hasta').onchange = e => { fVis.hasta = e.target.value; pintarLista(); };
  $('#vi-pdf').onclick = e => {
    if (!fVis.obra) { aviso('Elige primero la obra en el filtro «Obra».', true); $('#v-f-obra').focus(); return; }
    if (fVis.desde && fVis.hasta && fVis.hasta < fVis.desde) { aviso('La fecha «Hasta» es anterior a «Desde».', true); return; }
    botonPDF(e.currentTarget, () => pdfAnotaciones(fVis.obra, fVis.desde, fVis.hasta));
  };
  pintarLista();
}

  };
  const b = $('#vi-borrar');
  if (b) b.onclick = async () => {
    if (!await confirmar(`¿Borrar la anotación del ${fFecha(visita.fecha)}? No se puede deshacer.`)) return;
    try { await q(sb.from('visitas').delete().eq('id', id)); aviso('Anotación borrada'); irA('#visitas'); } catch (e) { aviso(mensajeError(e), true); }
  };
  if (nueva) $('#vi-notas').focus();
}

/* =================== MÁS (móvil) =================== */
async function vistaMas(_, t) {
  if (window.matchMedia('(min-width: 900px)').matches) { location.replace('#inicio'); return; }
  cabecera({ titulo: 'Más' });
  const cfg = leerConfig();
  $('#vista').innerHTML = `
    <ul class="menu-mas">
      <li><a href="#visitas">${ic('visitas')}Anotaciones${ic('sig', 18)}</a></li>
      <li><a href="#personal">${ic('personal')}Personal${ic('sig', 18)}</a></li>
      <li><a href="#maquinaria">${ic('maquinaria')}Maquinaria${ic('sig', 18)}</a></li>
    </ul>
    <section class="tarjeta"><p class="etiqueta-seccion">Próximamente</p>
      <div class="chips-prox"><span>Informes con IA</span><span>Seguimiento de incidencias</span><span>Fotografías</span><span>PDF</span></div>
    </section>
    <section class="tarjeta"><p class="etiqueta-seccion">Tu cuenta</p>
      <p style="margin:0;word-break:break-all">${esc(usuario?.email || '')}</p>
      <div style="display:flex;flex-wrap:wrap;gap:10px"><button class="btn btn-secundario" type="button" data-salir>Cerrar sesión</button>
      ${cfg && !cfg.fija ? '<button class="btn btn-secundario" type="button" id="cambiar-con">Cambiar conexión</button>' : ''}</div>
    </section>`;
  $$('[data-salir]', $('#vista')).forEach(b => b.onclick = salir);
  const cc = $('#cambiar-con'); if (cc) cc.onclick = async () => { try { localStorage.removeItem('cdo-conexion'); } catch (e) {} await sb.auth.signOut(); location.reload(); };
}

const VISTAS = { inicio: vistaInicio, obras: vistaObras, obra: formObra, partes: vistaPartes, parte: formParte, tareas: vistaTareas, tarea: formTarea, personal: vistaPersonal, persona: formPersona, maquinaria: vistaMaquinaria, maquina: formMaquina, visitas: vistaVisitas, visita: formVisita, mas: vistaMas };

iniciar();
